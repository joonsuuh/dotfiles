# Set prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Set mouse wheel on
set -g mouse on

# || plugins ||
# TPM keeps the plugins in ~/.config/tmux/plugins. Press prefix + I to install
# a new plugin, and prefix + U to update them.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore the last saved session when the tmux server starts.
set -g @continuum-restore 'on'

# Install TPM and the plugins on a machine that has no TPM.
if "test ! -d ~/.config/tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Start TPM. Keep this line at the end of the file.
run '~/.config/tmux/plugins/tpm/tpm'
